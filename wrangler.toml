#:schema node_modules/wrangler/config-schema.json
# Full LMS on Cloudflare Containers (Node Next.js) behind a thin Worker gateway.
# The full Next.js application runs in the Container; this Worker is only its gateway.
name = "rillcodwebsite"
main = "src/cloudflare/container-gateway.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Production + staging custom domains on rillcod.com zone.
[[routes]]
pattern = "www.rillcod.com"
custom_domain = true
zone_name = "rillcod.com"

[[routes]]
pattern = "rillcod.com"
custom_domain = true
zone_name = "rillcod.com"

[[routes]]
pattern = "cf.rillcod.com"
custom_domain = true
zone_name = "rillcod.com"

[[containers]]
class_name = "NextAppContainer"
image = "./Dockerfile.cf"
max_instances = 5
instance_type = "standard-2"
image_vars = { NEXT_PUBLIC_APP_URL = "https://www.rillcod.com", NEXT_PUBLIC_SUPABASE_URL = "https://akaorqukdoawacvxsdij.supabase.co", NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYW9ycXVrZG9hd2FjdnhzZGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMDg2MzgsImV4cCI6MjA4NzU4NDYzOH0.60US0KpUqtur_5YqPSX3qxPex1wkzAG7WX-WBmoMi-s", NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY = "sb_publishable_ayfXqNoQdQQbDFskLBwoPA_qQQoZnC-", NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY = "pk_live_e5f065f4708f8f1c865131c5a40d2e937bd1515d", NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BIBaCy_MbkmVNVBrxQkfzaq6HsCzPtZc8Lp-_N2Apo_6iW17itdwOL5gLXR87DMdXugsNivJLBP43HAjW-n4eFs", NEXT_PUBLIC_SUMMER_SCHOOL_WHATSAPP_GROUP = "https://chat.whatsapp.com/GHpWqij1epR4m0Y4HuKGfz" }

[[durable_objects.bindings]]
name = "NEXT_APP"
class_name = "NextAppContainer"

[[migrations]]
tag = "v1-next-container"
new_sqlite_classes = ["NextAppContainer"]

# NO [triggers] BLOCK — this is deliberate, do not re-add one.
# Every scheduled job is registered on cron-job.org, outside this repo. A [triggers]
# block here does not replace that; the gateway's scheduled() handler would fire the
# same routes a second time, double-sending the invoice, billing and payment reminders
# that email parents. See the header of src/lib/operations/cron-registry.ts, which is
# the single source of truth for what runs and how often.

[vars]
NEXT_PUBLIC_APP_URL = "https://www.rillcod.com"
NEXT_PUBLIC_SUPABASE_URL = "https://akaorqukdoawacvxsdij.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYW9ycXVrZG9hd2FjdnhzZGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMDg2MzgsImV4cCI6MjA4NzU4NDYzOH0.60US0KpUqtur_5YqPSX3qxPex1wkzAG7WX-WBmoMi-s"
