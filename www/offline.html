<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f1a" />
    <title>Reconnect | Rillcod Academy</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0f0f1a;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 12%, rgba(59, 111, 232, 0.22), transparent 38%),
          #0f0f1a;
      }
      .card {
        width: min(100%, 420px);
        padding: 30px 24px 24px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.9);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
        text-align: center;
      }
      .mark {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        overflow: hidden;
        border-radius: 20px;
        background: #0f0f1a;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      .mark img { width: 72%; height: 72%; object-fit: contain; }
      .status {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.12);
        color: #fbbf24;
        font-size: 22px;
      }
      h1 { margin: 0; font-size: 1.35rem; line-height: 1.25; letter-spacing: -0.02em; }
      p { margin: 10px auto 0; max-width: 19rem; color: #a1a1aa; font-size: 0.94rem; line-height: 1.55; }
      button {
        width: 100%;
        min-height: 50px;
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        background: #3b6fe8;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.985); }
      button:disabled { opacity: 0.68; cursor: wait; }
      .hint { margin-top: 14px; color: #71717a; font-size: 0.76rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true"><img src="./logo.png" alt="" /></div>
      <div class="status" aria-hidden="true">!</div>
      <h1>We could not reach Rillcod Academy</h1>
      <p id="message" role="status" aria-live="polite">Check your internet connection, then try again. Your account and saved work are safe.</p>
      <button id="retry" type="button">Try again</button>
      <div class="hint">The app reconnects automatically when your connection returns.</div>
    </main>
    <script>
      (function () {
        var destination = 'https://www.rillcod.com/login';
        var button = document.getElementById('retry');
        var message = document.getElementById('message');
        var retrying = false;

        function retry() {
          if (retrying) return;
          retrying = true;
          button.disabled = true;
          button.textContent = 'Reconnecting...';
          message.textContent = 'Reconnecting securely to Rillcod Academy.';
          window.location.replace(destination);
          window.setTimeout(function () {
            retrying = false;
            button.disabled = false;
            button.textContent = 'Try again';
            message.textContent = 'We still could not connect. Check your connection and try once more.';
          }, 8000);
        }

        button.addEventListener('click', retry);
        window.addEventListener('online', retry);
      })();
    </script>
  </body>
</html>
