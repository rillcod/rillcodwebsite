<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>Rillcod Academy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0f0f1a;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(2rem, env(safe-area-inset-top)) max(2rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(2rem, env(safe-area-inset-left));
      text-align: center;
      gap: 1.25rem;
    }
    .mark {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: rgba(255,255,255,0.06);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .mark img {
      width: 72%;
      height: 72%;
      object-fit: contain;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 800;
    }
    h1 span { color: #ef4444; letter-spacing: 0; }
    p {
      margin: 0;
      max-width: 18rem;
      color: #a1a1aa;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
  <script>
    // Prefer the live app (login → dashboard if already signed in).
    (function () {
      try {
        if (navigator.onLine) {
          window.location.replace('https://www.rillcod.com/login');
        }
      } catch (e) {}
      window.addEventListener('online', function () {
        window.location.replace('https://www.rillcod.com/login');
      });
    })();
  </script>
</head>
<body>
  <main class="shell">
    <div class="mark" aria-hidden="true">
      <img src="./logo.png" alt="" />
    </div>
    <h1>RILLCOD<span>.</span></h1>
    <p role="status" aria-live="polite">Opening Rillcod Academy… If you are offline, reconnect and the app will continue automatically.</p>
    <a href="https://www.rillcod.com/login" onclick="window.location.reload(); return false;">Try again</a>
  </main>
</body>
</html>
