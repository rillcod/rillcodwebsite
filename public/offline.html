<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Rillcod Technologies</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f0f1a;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
      }
      button { margin-top: 18px; min-height: 44px; border: 0; border-radius: 12px; padding: 0 20px; background: #3b6fe8; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p role="status" aria-live="polite">Reconnect to continue. The app will retry automatically when your connection returns.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
    <script>
      window.addEventListener('online', function () { window.location.reload(); });
    </script>
  </body>
</html>
