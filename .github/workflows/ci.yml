name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NEXT_PUBLIC_APP_URL: https://www.rillcod.com
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      CRON_SECRET: ci-cron-secret
      BILLING_CRON_SECRET: ci-billing-cron-secret
      ENABLE_PAYMENTS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Encoding check
        run: npm run lint:encoding

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Supabase embed audit
        run: npm run audit:embeds

      # Replays every select() against the real schema. Skips automatically unless real
      # service-role credentials are provided, because the env block above uses placeholders.
      # To enforce it, add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository secrets.
      - name: Schema drift check
        run: npm run check:schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Production build
        run: npm run build
